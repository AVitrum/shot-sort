# The end-to-end scripts in tests/e2e: the real app process driven through UI Automation, and real installers.
# Slower than the unit and in-process tests, so on demand, weekly and when they change, instead of on every push.
name: End-to-end

on:
  workflow_dispatch:
  # Also when the scripts or this workflow change, so a broken script shows up in its own PR.
  pull_request:
    paths:
      - 'tests/e2e/**'
      - '.github/workflows/e2e.yml'
  schedule:
    - cron: '41 4 * * 1'

permissions:
  contents: read

jobs:
  ui:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.402
      - name: Build
        run: dotnet build ScreenSorter.slnx -nologo
      - name: Windows, tray and self-contained build
        shell: powershell
        env:
          SCREENSORTER_E2E_ROOT: ${{ runner.temp }}/ScreenSorterE2E
        run: |
          & ./tests/e2e/run-all.ps1; $failed = $LASTEXITCODE
          & powershell -NoProfile -ExecutionPolicy Bypass -File ./tests/e2e/installed-run.ps1; if ($LASTEXITCODE -ne 0) { $failed++ }
          exit $failed
      - name: Keep logs and window pictures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-ui
          path: ${{ runner.temp }}/ScreenSorterE2E
          if-no-files-found: ignore

  installer:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.402
      - name: Build
        run: dotnet build ScreenSorter.slnx -nologo
      - name: Build smoke installers 0.0.1 and 0.0.2
        shell: powershell
        run: |
          $old = & ./installer/build-installer.ps1 -Version 0.0.1 -SmokeTest -SmokeMutex | Select-Object -Last 1
          $new = & ./installer/build-installer.ps1 -Version 0.0.2 -SmokeTest -SmokeMutex | Select-Object -Last 1
          "OLD_SETUP=$old" | Add-Content $env:GITHUB_ENV
          "NEW_SETUP=$new" | Add-Content $env:GITHUB_ENV
      - name: Install, uninstall question, update
        shell: powershell
        env:
          SCREENSORTER_E2E_ROOT: ${{ runner.temp }}/ScreenSorterE2E
        run: |
          # Each script in its own process, so one that throws does not skip the others.
          function Run($script, [string[]]$params) {
            & powershell -NoProfile -ExecutionPolicy Bypass -File "./tests/e2e/$script" @params
            if ($LASTEXITCODE -ne 0) { $script:failed++ }
          }
          $failed = 0
          Run 'install.ps1' @('-Setup', $env:OLD_SETUP)
          Run 'uninstall-ask.ps1' @('-Setup', $env:OLD_SETUP)
          # No real ScreenSorter on a runner: anything still running is a smoke copy, and the update needs none.
          Get-Process ScreenSorter.App -ErrorAction SilentlyContinue | Stop-Process -Force
          Run 'update.ps1' @('-OldSetup', $env:OLD_SETUP, '-NewSetup', $env:NEW_SETUP)
          exit $failed
      - name: Keep logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-installer
          path: ${{ runner.temp }}/ScreenSorterE2E
          if-no-files-found: ignore
