name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Weekly, so a newly published advisory for a dependency fails the build even when nothing was pushed.
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.402
      - name: Build
        run: dotnet build ScreenSorter.slnx -c Release -nologo -warnaserror
      - name: Build the release signing tool
        run: dotnet build installer/release-key.cs
      - name: Test
        run: dotnet test ScreenSorter.slnx -c Release --no-build -nologo --collect "XPlat Code Coverage" --settings tests/coverage.runsettings --results-directory TestResults
      # Report only: coverage never fails the build.
      - name: Coverage summary
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: pwsh
        run: ./.github/scripts/coverage-summary.ps1 -Path TestResults -Out $env:GITHUB_STEP_SUMMARY

  safety-rules:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check tracked files
        shell: bash
        run: sh .githooks/check-tree.sh
