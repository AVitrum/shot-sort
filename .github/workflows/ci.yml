name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Weekly, so a newly published advisory for a dependency fails the build even when nothing was pushed.
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.402
      - name: Build
        run: dotnet build ScreenSorter.slnx -c Release -nologo -warnaserror
      - name: Build the release signing tool
        run: dotnet build installer/release-key.cs
      - name: Test
        run: dotnet test ScreenSorter.slnx -c Release --no-build -nologo

  safety-rules:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check tracked files
        shell: bash
        run: sh .githooks/check-tree.sh
