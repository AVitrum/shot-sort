# Pushing a tag such as v1.2.3 builds the installer and attaches it to a draft release, to read over, sign and publish by
# hand. Signing happens off GitHub, with installer/sign-release.ps1, because the key must not be here: installed copies
# refuse a release without that signature.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.402
      - name: Test
        run: dotnet test ScreenSorter.slnx -c Release -nologo
      - name: Build the installer
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $installer = & ./installer/build-installer.ps1 -Version $version
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $installer -Leaf)" | Set-Content -Encoding ascii "$installer.sha256"
          "INSTALLER=$installer" | Add-Content $env:GITHUB_ENV
      - name: Create a draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' $env:INSTALLER "$env:INSTALLER.sha256" --draft --generate-notes --title '${{ github.ref_name }}'
