# Weekly update PRs. Actions are pinned by commit SHA, so without this they would never move.
# Minor and patch updates come grouped in one PR per ecosystem; major updates come one by one, to read on their own.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]
    # The app runs on .NET 10 (LTS). Packages released with the runtime stay on its 10.0.x servicing line, which
    # carries the security fixes; a new major comes with a deliberate move of the whole app to a newer runtime.
    ignore:
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Data.Sqlite*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
